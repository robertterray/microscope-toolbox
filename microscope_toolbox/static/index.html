<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Item</title>
    <link rel="stylesheet" href="/vendor/bootstrap-5.3.3.min.css">
</head>
<body class="bg-body-tertiary">
    <div class="container py-5" style="max-width: 540px;">
        <div id="status" class="alert alert-secondary d-flex align-items-center gap-2 py-2 small" role="status">
            <span id="status-badge" class="badge text-bg-secondary">…</span>
            <span id="status-text">downdetector.com: checking…</span>
            <span id="status-checked" class="ms-auto text-body-secondary"></span>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h3 card-title mb-4">Create Item</h1>
                <form id="item-form">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description <span class="text-body-secondary">(optional)</span>
                        </label>
                        <textarea id="description" name="description" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Create</button>
                </form>
            </div>
        </div>

        <div id="result" class="alert mt-4 d-none" role="alert">
            <div id="result-title" class="fw-semibold"></div>
            <pre id="result-body" class="mb-0 mt-2 small"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById("item-form");
        const result = document.getElementById("result");
        const resultTitle = document.getElementById("result-title");
        const resultBody = document.getElementById("result-body");

        function showResult(ok, title, body) {
            result.className = "alert mt-4 " + (ok ? "alert-success" : "alert-danger");
            resultTitle.textContent = title;
            resultBody.textContent = body;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const description = form.description.value.trim();
            const body = { name: form.name.value.trim(), description: description || null };

            try {
                const response = await fetch("/items", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                const data = await response.json();
                const pretty = JSON.stringify(data, null, 2);
                if (response.ok) {
                    showResult(true, "Created", pretty);
                    form.reset();
                } else {
                    showResult(false, "Error " + response.status, pretty);
                }
            } catch (err) {
                showResult(false, "Request failed", String(err));
            }
        });

        const status = document.getElementById("status");
        const statusBadge = document.getElementById("status-badge");
        const statusText = document.getElementById("status-text");
        const statusChecked = document.getElementById("status-checked");

        function setStatus(variant, badge, text) {
            status.className = `alert alert-${variant} d-flex align-items-center gap-2 py-2 small`;
            statusBadge.className = `badge text-bg-${variant}`;
            statusBadge.textContent = badge;
            statusText.textContent = text;
        }

        async function refreshStatus() {
            try {
                const response = await fetch("/status/downdetector");
                const data = await response.json();
                if (data.up) {
                    setStatus("success", "UP", `downdetector.com (${data.status_code}, ${data.latency_ms} ms)`);
                } else {
                    setStatus("danger", "DOWN", `downdetector.com (${data.status_code ?? data.error})`);
                }
            } catch (err) {
                setStatus("secondary", "?", "downdetector.com: status check failed");
            }
            statusChecked.textContent = "checked " + new Date().toLocaleTimeString();
        }

        refreshStatus();
        setInterval(refreshStatus, 5000);
    </script>
</body>
</html>
