[project]
name = "microscope_toolbox"
dynamic = ["version"]
description = "Microscope toolbox"
readme = "README.md"
authors = [
    {name = "Zahid Panjwani", email = "zahid@terraytx.com"}
]
urls = {homepage = "https://github.com/terraytherapeutics/microscope_toolbox"}
requires-python = ">=3.9,<3.11"
classifiers = ["Private :: Do Not Upload"]

dependencies = [
    "requests>=2.25",
    "pyyaml>=5.3",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
pinned = [
    "requests==2.31.0",
    "pyyaml==6.0",
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
]
dev = [
    "coverage==6.3.2",
    "black==24.1.0",
    "build==0.8.0",
    "pytest==7.1.2",
    "pytest-cov==3.0.0",
    "mypy==0.950",
    "httpx==0.27.2",
]

[[tool.uv.index]]
name = "terray_pypi_store"
url = "https://terray-python-291672471869.d.codeartifact.us-west-2.amazonaws.com/pypi/pypi-store/simple"
publish-url = "https://terray-python-291672471869.d.codeartifact.us-west-2.amazonaws.com/pypi/pypi-store"
authenticate = "always"

[tool.setuptools]
packages = { find = { include = ["microscope_toolbox*"] } }

[tool.setuptools.dynamic]
version = {attr = "microscope_toolbox.__version__"}

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

