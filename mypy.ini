# Global options:
[mypy]
warn_return_any = False
ignore_missing_imports = True
follow_imports = skip
disallow_untyped_defs = True
# Hide these error codes, start by working way down this list, 
disable_error_code =
    arg-type,
    operator,
    call-overload,
    name-match

# mypy 0.950 can't parse numpy 2's stubs. Only imaging_runs_in_kernel uses numpy and
# pandas, and that code runs on the Jupyter server, not in this app.
[mypy-numpy,numpy.*,pandas,pandas.*]
follow_imports = skip
follow_imports_for_stubs = True
